<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ziblon Studio — Grooming Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#2b2428; --mid:#4a3f44; --gold:#c9a14a; --gold-d:#a9863c; --gold-l:#e8cf8e;
  --cream:#fffcf3; --line:#e9d8a6;
  /* Logo lagana ho to: --logo-url: url("logo.png"); phir .avatar / .msg-icon mein emoji hata do */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#1a1518 0%,#33292f 50%,#1a1518 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.widget{width:100%;max-width:420px;background:#fff;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.4),0 4px 20px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;height:640px;max-height:calc(100vh - 40px)}

/* HEADER */
.header{background:linear-gradient(135deg,var(--dark) 0%,var(--mid) 50%,var(--dark) 100%);padding:20px 20px 16px;flex-shrink:0;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(201,161,74,.14);border-radius:50%}
.header::after{content:'';position:absolute;bottom:-20px;left:-20px;width:80px;height:80px;background:rgba(201,161,74,.07);border-radius:50%}
.header-top{display:flex;align-items:center;gap:13px;position:relative;z-index:1}
.avatar{width:52px;height:52px;background:linear-gradient(135deg,var(--gold),var(--gold-l));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 4px 12px rgba(201,161,74,.4);border:2px solid var(--gold-l)}
.header-info{flex:1}
.clinic-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;line-height:1.1;letter-spacing:.8px;text-transform:uppercase}
.clinic-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:3px;letter-spacing:.8px;text-transform:uppercase}
.online-badge{display:flex;align-items:center;gap:5px;margin-top:5px}
.online-dot{width:7px;height:7px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,.4)}50%{opacity:.7;box-shadow:0 0 0 4px rgba(74,222,128,0)}}
.online-text{font-size:11px;color:rgba(255,255,255,.65)}
.tagline{padding-top:10px;position:relative;z-index:1;font-size:11.5px;color:var(--gold-l);letter-spacing:.4px}

/* INFO BAR + QUICK BUTTONS */
.info-bar{background:var(--cream);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:14px;flex-shrink:0;overflow-x:auto}
.info-bar::-webkit-scrollbar,.quick-row::-webkit-scrollbar{display:none}
.info-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#8a6d1f;font-weight:600;white-space:nowrap}
.quick-row{padding:10px 14px;display:flex;gap:7px;overflow-x:auto;border-bottom:1px solid #f5f0ea;flex-shrink:0}
.qbtn{flex-shrink:0;padding:6px 13px;border-radius:20px;background:var(--cream);border:1px solid var(--line);color:#1c1c1c;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.qbtn:hover{background:var(--gold);color:#fff;border-color:var(--gold)}

/* MESSAGES */
.messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fafaf8}
.messages::-webkit-scrollbar{width:3px}
.messages::-webkit-scrollbar-thumb{background:#e0d5c8;border-radius:99px}
.msg{display:flex;gap:8px;align-items:flex-end;animation:fadeUp .25s ease}
.msg.bot{align-self:flex-start;max-width:90%}
.msg.user{align-self:flex-end;max-width:80%;flex-direction:row-reverse}
.msg-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--mid),var(--dark));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;border:1.5px solid var(--gold)}
.msg-content{display:flex;flex-direction:column;gap:3px;min-width:0}
.bubble{padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;word-wrap:break-word}
.msg.bot .bubble{background:#fff;color:#1c1c1c;border-radius:4px 18px 18px 18px;border:1px solid #eee;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.msg.user .bubble{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:#fff;font-weight:600;border-radius:18px 4px 18px 18px}
.msg-time{font-size:10.5px;color:#bbb;padding:0 3px}
.msg.user .msg-time{text-align:right}
.typing-dots{display:flex;gap:4px;padding:4px 2px}
.typing-dots span{width:7px;height:7px;background:var(--gold);border-radius:50%;animation:dot 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* OPTIONS / BUTTONS */
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opt{padding:6px 13px;border-radius:20px;border:1.5px solid #1c1c1c;background:var(--cream);color:#1c1c1c;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.opt:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.wa-btn{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:9px 15px;background:#25d366;color:#fff;border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;transition:background .15s}
.wa-btn:hover{background:#1da851}
.call-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font-size:13.5px;font-weight:700;background:#1c1c1c;color:#fff;border:none;border-radius:12px;cursor:pointer;text-decoration:none;transition:opacity .2s}
.call-btn:hover{opacity:.88}

/* DEAL CARDS */
.deal{background:var(--cream);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px;margin-top:8px}
.deal-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.deal-name{font-family:'Playfair Display',serif;font-weight:700;font-size:14.5px;color:var(--dark)}
.deal-price{font-weight:700;font-size:13.5px;color:var(--gold-d);white-space:nowrap}
.deal ul{margin:6px 0 4px 16px;font-size:12px;color:#555;line-height:1.5}
.deal-note{font-size:10.5px;color:#999;font-style:italic}
.deal .opt{margin-top:6px;display:inline-block}
.price-list{background:#fff;border:1px solid #eee;border-radius:14px;padding:4px 12px;margin-top:10px}
.price-row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #f5f0ea;font-size:12.5px;color:#1c1c1c;font-weight:500}
.price-row:last-child{border-bottom:none}
.price-row strong{color:var(--gold-d);white-space:nowrap}

/* INPUT */
.input-area{padding:10px 14px;background:#fff;border-top:1px solid #f0e8d8;display:flex;gap:8px;align-items:center;flex-shrink:0}
.text-input{flex:1;min-width:0;background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:#1c1c1c;outline:none;transition:border-color .15s}
.text-input:focus{border-color:var(--gold);background:#fff}
.text-input::placeholder{color:#bbb}
.send-btn{width:40px;height:40px;background:linear-gradient(135deg,var(--gold),var(--gold-d));border:none;border-radius:12px;cursor:pointer;color:#fff;font-size:16px;flex-shrink:0;transition:opacity .15s}
.send-btn:hover{opacity:.9}.send-btn:disabled{opacity:.4;cursor:not-allowed}

/* BOOKING MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:380px;max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.35);animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h2{font-family:'Playfair Display',serif;font-size:19px;letter-spacing:.3px;color:#1c1c1c}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;line-height:1}
.modal-close:hover{color:#333}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;font-weight:700;color:#8a6d1f;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;font-size:13.5px;border:1.5px solid var(--line);border-radius:10px;outline:none;font-family:inherit;background:var(--cream);transition:border .2s;color:#1c1c1c}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold)}
.form-group textarea{resize:none;height:64px}
.form-row{display:flex;gap:10px}.form-row .form-group{flex:1;min-width:0}
.submit-btn{width:100%;padding:12px;font-size:13.5px;font-weight:700;border:none;border-radius:12px;color:#fff;cursor:pointer;transition:opacity .2s;margin-top:4px;background:linear-gradient(135deg,var(--gold),var(--gold-d))}
.submit-btn:hover{opacity:.88}
.success-state{display:none;text-align:center;padding:6px 0}
.success-icon{width:54px;height:54px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
.success-state h3{font-family:'Playfair Display',serif;font-size:18px;color:#1c1c1c;margin-bottom:6px}
.success-state p{font-size:12.5px;color:#777;margin-bottom:18px;line-height:1.5}
.action-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.action-row .wa-btn{margin-top:0;padding:11px 20px;font-size:13.5px;font-weight:700;border-radius:12px}
.modal-back{background:none;border:none;color:#aaa;font-size:12.5px;cursor:pointer;margin-top:10px}
.modal-back:hover{color:#333}
</style>
</head>
<body>
<div class="widget">
  <div class="header">
    <div class="header-top">
      <div class="avatar" id="h-icon"></div>
      <div class="header-info">
        <div class="clinic-title" id="h-name"></div>
        <div class="clinic-sub" id="h-sub"></div>
        <div class="online-badge"><div class="online-dot"></div><div class="online-text">AI Assistant • Available now</div></div>
      </div>
    </div>
    <div class="tagline" id="h-tag"></div>
  </div>

  <div class="info-bar" id="info-bar"></div>
  <div class="quick-row" id="quick-row"></div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" class="text-input" id="user-input" placeholder="Ask me anything..." autocomplete="off">
    <button class="send-btn" id="send-btn" aria-label="Send">➤</button>
  </div>
</div>

<!-- BOOKING MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div id="formState">
      <div class="modal-header"><h2>Book Appointment</h2><button class="modal-close" id="modalX" aria-label="Close">✕</button></div>
      <div class="form-row">
        <div class="form-group"><label for="mName">Full Name</label><input type="text" id="mName" placeholder="Your name" autocomplete="name"></div>
        <div class="form-group"><label for="mPhone">Phone</label><input type="tel" id="mPhone" placeholder="03XX-XXXXXXX" autocomplete="tel"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="mDate">Date</label><input type="date" id="mDate"></div>
        <div class="form-group" id="mTimeWrap"></div>
      </div>
      <div class="form-group"><label for="mService">Deal / Service</label><select id="mService"></select></div>
      <div class="form-group"><label for="mNote">Note (optional)</label><textarea id="mNote" placeholder="Any special request..."></textarea></div>
      <button class="submit-btn" id="submitBtn">Confirm Booking</button>
    </div>
    <div class="success-state" id="successState">
      <div class="success-icon">📩</div>
      <h3>One Last Step!</h3>
      <p id="successMsg"></p>
      <div class="action-row">
        <a id="waLink" class="wa-btn" target="_blank" rel="noopener">💬 WhatsApp</a>
        <a id="callLink" class="call-btn" href="#">📞 Call Now</a>
      </div>
      <button class="modal-back" id="modalClose2">Close</button>
    </div>
  </div>
</div>

<script>
/* ===================== CONFIG — naye client ke liye sirf yahan badlo ===================== */
const C = {
  name: "Ziblon Studio",
  sub: "Men's Salon & Grooming · DHA Phase 6",
  tagline: "✦ The Best Salon — Premium grooming deals, male to male",
  icon: "👑",
  address: "Shop No. 1, Building 24-C, Lane 2, Ittehad Commercial, Phase 6, DHA, Karachi, Pakistan",
  shortLocation: "DHA Phase 6, Karachi",
  mapQuery: "Ittehad Commercial Phase 6 DHA Karachi",
  phoneDisplay: "+92 325 3426704",
  phoneTel: "+923253426704",
  whatsapp: "923253426704",
  note: "Male to male service",
  timings: "",                 // abhi pata nahi. Khali = bot WhatsApp pe pochne ko kahega
  slotStart: 12,               // booking dropdown ka pehla slot (12 = 12 PM). ABHI ASSUMED HAI, asli timings aane pe badlo
  slotEnd: 22,                 // aakhri slot (22 = 10 PM). null/null karoge to time free-text ban jayega
  apiUrl: "",                  // Claude backend URL (optional). Khali = sirf built-in replies
  deals: [
    { no: 1, price: 4499,  items: ["Full body massage", "Professional hair cut", "Professional beard", "Face cleansing"], note: "Male to male" },
    { no: 2, price: 6999,  items: ["Professional beard", "Full body massage", "Full body scrubbing"] },
    { no: 3, price: 7999,  items: ["Head & shoulder massage (30 min)", "Professional hair cut", "Professional beard", "Face cleansing", "Manicure & pedicure"] },
    { no: 4, price: 3999,  items: ["Professional hair cut", "Professional beard", "Facial: face cleansing, scrubbing, mask, face massage & face steam"] },
    { no: 5, price: 12499, items: ["Full body massage with hot towel", "Full body wax / trimming / razor"] }
  ]
};
/* ========================================================================================= */

const $ = id => document.getElementById(id);
const money = n => "Rs. " + n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nowT = () => new Date().toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const dealLabel = d => "Deal No." + d.no + " (" + money(d.price) + ")";

const SYSTEM = "You are a warm, professional AI receptionist for " + C.name + ", a men's salon at " + C.address +
  ". Phone: " + C.phoneDisplay + ". " + (C.timings ? "Timings: " + C.timings + ". " : "") +
  "Deals: " + C.deals.map(d => "Deal No." + d.no + " " + money(d.price) + " (" + d.items.join(", ") + ")").join("; ") +
  ". Never invent services, prices or timings that are not listed. If unsure, ask the customer to WhatsApp " + C.phoneDisplay +
  ". Keep replies short (2-3 sentences), warm and professional. Reply in the customer's language (Urdu/Roman Urdu or English).";
let history = [];

/* ---------- static UI ---------- */
document.title = C.name + " — Grooming Assistant";
$("h-icon").textContent = C.icon;
$("h-name").textContent = C.name;
$("h-sub").textContent = C.sub;
$("h-tag").textContent = C.tagline;
$("info-bar").innerHTML =
  '<div class="info-item">📍 ' + esc(C.shortLocation) + '</div>' +
  '<div class="info-item">📞 ' + esc(C.phoneDisplay) + '</div>' +
  '<div class="info-item">🎁 ' + C.deals.length + ' Deals</div>' +
  (C.note ? '<div class="info-item">🤝 ' + esc(C.note) + '</div>' : '');
[["📅 Appointment", () => openModal()], ["🎁 Deals", () => quickAsk("Show deals")], ["💰 Pricing", () => quickAsk("Pricing")],
 ["💆 Massage", () => quickAsk("Massage services")], ["✨ Facial", () => quickAsk("Facial options")],
 ["🕐 Timings", () => quickAsk("What are your timings?")], ["📍 Location", () => quickAsk("Where are you located?")], ["📞 Contact", () => quickAsk("Contact us")]]
  .forEach(([label, fn]) => { const b = document.createElement("div"); b.className = "qbtn"; b.textContent = label; b.onclick = fn; $("quick-row").appendChild(b); });

/* ---------- chat helpers ---------- */
const scrollDown = () => { $("messages").scrollTop = $("messages").scrollHeight; };
function addBot(html) {
  const d = document.createElement("div"); d.className = "msg bot";
  d.innerHTML = '<div class="msg-icon">' + C.icon + '</div><div class="msg-content"><div class="bubble">' + html + '</div><div class="msg-time">' + nowT() + '</div></div>';
  $("messages").appendChild(d); scrollDown();
}
function addUser(text) {
  const d = document.createElement("div"); d.className = "msg user";
  const c = document.createElement("div"); c.className = "msg-content";
  const b = document.createElement("div"); b.className = "bubble"; b.textContent = text;
  const t = document.createElement("div"); t.className = "msg-time"; t.textContent = nowT();
  c.append(b, t); d.appendChild(c); $("messages").appendChild(d); scrollDown();
}
function showTyping() {
  const d = document.createElement("div"); d.className = "msg bot"; d.id = "typing";
  d.innerHTML = '<div class="msg-icon">' + C.icon + '</div><div class="msg-content"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>';
  $("messages").appendChild(d); scrollDown();
}
const removeTyping = () => { const t = $("typing"); if (t) t.remove(); };
const waBtn = msg => '<br><a class="wa-btn" href="https://wa.me/' + C.whatsapp + '?text=' + encodeURIComponent(msg) + '" target="_blank" rel="noopener">💬 Chat on WhatsApp</a>';
const footer = () => '<div class="opts"><div class="opt" onclick="openModal()">📅 Book Now</div><div class="opt" onclick="mainMenu()">🏠 Main Menu</div></div>';

function dealCard(d) {
  return '<div class="deal"><div class="deal-top"><span class="deal-name">Deal No. ' + d.no + '</span><span class="deal-price">' + money(d.price) + '</span></div>' +
    '<ul>' + d.items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>' +
    (d.note ? '<div class="deal-note">' + esc(d.note) + '</div>' : '') +
    '<div class="opt" onclick="openModal(' + d.no + ')">📅 Book this deal</div></div>';
}
const priceList = () => '<div class="price-list">' + C.deals.map(d => '<div class="price-row"><span>Deal No.' + d.no + '</span><strong>' + money(d.price) + '</strong></div>').join('') + '</div>';

function mainMenu() {
  addUser("Main Menu"); showTyping();
  setTimeout(() => {
    removeTyping();
    addBot('How else can I help you? 👋<div class="opts">' +
      '<div class="opt" onclick="openModal()">📅 Book Appointment</div>' +
      '<div class="opt" onclick="quickAsk(\'Show deals\')">🎁 Deals</div>' +
      '<div class="opt" onclick="quickAsk(\'Pricing\')">💰 Pricing</div>' +
      '<div class="opt" onclick="quickAsk(\'Where are you located?\')">📍 Location</div>' +
      '<div class="opt" onclick="quickAsk(\'Contact us\')">📞 Contact</div></div>');
  }, 450);
}

/* ---------- booking modal ---------- */
function buildTimeField() {
  const wrap = $("mTimeWrap");
  if (typeof C.slotStart === "number" && typeof C.slotEnd === "number") {
    let opts = "";
    for (let mins = C.slotStart * 60; mins <= C.slotEnd * 60; mins += 30) {
      const h = Math.floor(mins / 60), m = mins % 60, h12 = (h % 12) || 12;
      opts += "<option>" + h12 + ":" + (m === 0 ? "00" : m) + " " + (h >= 12 ? "PM" : "AM") + "</option>";
    }
    wrap.innerHTML = '<label for="mTime">Time</label><select id="mTime">' + opts + '</select>';
  } else {
    wrap.innerHTML = '<label for="mTime">Preferred Time</label><input type="text" id="mTime" placeholder="e.g. 5:30 PM">';
  }
}
function openModal(dealNo) {
  $("mService").innerHTML =
    '<optgroup label="Deals">' + C.deals.map(d => '<option value="' + esc(dealLabel(d)) + '"' + (d.no === dealNo ? " selected" : "") + '>Deal No.' + d.no + ' — ' + money(d.price) + '</option>').join("") + '</optgroup>' +
    '<option value="Other / not sure yet">Other / not sure yet</option>';
  buildTimeField();
  ["mName", "mPhone", "mNote"].forEach(id => $(id).value = "");
  $("mDate").min = todayStr(); $("mDate").value = todayStr();
  $("formState").style.display = "block"; $("successState").style.display = "none";
  $("modalOverlay").classList.add("open");
}
const closeModal = () => $("modalOverlay").classList.remove("open");
function submitModalForm() {
  const name = $("mName").value.trim(), phone = $("mPhone").value.trim(), date = $("mDate").value, time = $("mTime").value.trim();
  const service = $("mService").value, note = $("mNote").value.trim();
  if (!name || !phone || !date || !time) { alert("Please fill in Name, Phone, Date and Time."); return; }
  if ((phone.match(/\d/g) || []).length < 10) { alert("Please enter a valid phone number."); return; }
  if (date < todayStr()) { alert("Please select today or a future date."); $("mDate").value = todayStr(); return; }

  const when = new Date(date + "T00:00:00").toLocaleDateString("en-PK", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  let wa = "*New Booking — " + C.name + "*\n\n👤 *Name:* " + name + "\n📞 *Phone:* " + phone + "\n📅 *Date:* " + when + "\n⏰ *Time:* " + time + "\n🎁 *Deal:* " + service + "\n";
  if (note) wa += "📝 *Note:* " + note + "\n";
  wa += "\nKindly confirm my appointment. Thank you! 🙏";

  $("waLink").href = "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(wa);
  $("callLink").href = "tel:" + C.phoneTel;
  $("successMsg").textContent = "Details noted for " + name + " on " + when + " at " + time + ". Tap below to confirm on WhatsApp or call us directly. Your slot isn't final until confirmed.";
  $("formState").style.display = "none"; $("successState").style.display = "block";
  addBot("📩 Almost done, " + esc(name) + "!<br>" + esc(when) + " at " + esc(time) + "<br>" + esc(service) + "<br>Please confirm on WhatsApp or call us to finalize your booking.");
}
$("modalX").onclick = closeModal; $("modalClose2").onclick = closeModal;
$("submitBtn").onclick = submitModalForm;
$("modalOverlay").addEventListener("click", e => { if (e.target === $("modalOverlay")) closeModal(); });

/* ---------- replies ---------- */
const hasAny = (m, words) => words.some(k => m.includes(k));

async function getReply(msg) {
  const m = msg.toLowerCase().trim();

  const dn = m.match(/deal\s*(?:no\.?|number|#)?\s*([1-9]\d?)/);
  if (dn) {
    const d = C.deals.find(x => x.no === Number(dn[1]));
    if (d) return "Here's the deal:" + dealCard(d) + footer();
  }
  if (hasAny(m, ["book", "appointment", "schedule", "reserve", "slot", "visit"])) {
    openModal();
    return "Opening the booking form for you now. Fill it in and we'll confirm your slot! ✂️" + footer();
  }
  if (hasAny(m, ["deal", "package", "offer", "bundle", "combo"]))
    return "🎁 Our <strong>" + C.deals.length + " grooming deals</strong>:" + C.deals.map(dealCard).join("") + footer();
  if (hasAny(m, ["price", "pricing", "cost", "rate", "kitna", "kitne", "charge", "fee"]))
    return "💰 Deals start from <strong>" + money(Math.min(...C.deals.map(d => d.price))) + "</strong>:" + priceList() + 'Kisi deal ki detail ke liye "deal 3" jaisa likhein.' + footer();
  if (hasAny(m, ["massage"]))
    return "💆 Massage in deals:" + C.deals.filter(d => d.items.some(i => /massage/i.test(i))).map(dealCard).join("") + footer();
  if (hasAny(m, ["facial", "cleansing", "steam"]))
    return "✨ Facial / face cleansing in deals:" + C.deals.filter(d => d.items.some(i => /facial|cleansing/i.test(i))).map(dealCard).join("") + footer();
  if (hasAny(m, ["beard", "hair cut", "haircut", "wax", "scrub", "pedicure", "manicure", "service", "treatment"]))
    return "Ye services hamare deals mein shamil hain:" + C.deals.map(dealCard).join("") + footer();
  if (hasAny(m, ["location", "address", "where", "kahan", "kidhar", "direction", "map"]))
    return "📍 <strong>" + esc(C.name) + "</strong><br>" + esc(C.address) +
      '<br><a class="wa-btn" style="background:#4285f4" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(C.mapQuery) + '" target="_blank" rel="noopener">🗺️ Open in Maps</a>' + footer();
  if (hasAny(m, ["time", "timing", "hour", "open", "close", "kab", "waqt"])) {
    if (C.timings) return "🕐 We are open <strong>" + esc(C.timings) + "</strong>. Booking advance mein karna behtar hai!" + footer();
    return "🕐 Timings ki confirmation ke liye hamari team ko WhatsApp karein, hum foran bata denge." + waBtn("Assalam-o-Alaikum " + C.name + ", aapki timings kya hain?") + footer();
  }
  if (hasAny(m, ["contact", "number", "phone", "call"]))
    return "📞 Aap humse seedha <strong>" + esc(C.phoneDisplay) + "</strong> pe rabta kar sakte hain.<br><a class=\"call-btn\" style=\"margin-top:10px\" href=\"tel:" + C.phoneTel + "\">📞 Call Now</a>" + waBtn("Assalam-o-Alaikum " + C.name + ", mujhe aap se ek sawal poochna tha.") + footer();
  if (/\b(hi|hello|hey|salam|assalam|assalamualaikum|start)\b/.test(m) || m.includes("salam"))
    return "Assalam-o-Alaikum! 👑 Welcome to <strong>" + esc(C.name) + "</strong>. Deals dekhna chahte hain ya booking karni hai?" + footer();
  if (/\b(thank|thanks|shukriya|shukria)\b/.test(m))
    return "You're most welcome! 🌟 Booking ke liye jab chahein message kar dein. JazakAllah!";

  if (C.apiUrl) {
    history.push({ role: "user", content: msg });
    try {
      const res = await fetch(C.apiUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ system: SYSTEM, messages: history }) });
      const data = await res.json();
      if (data.reply) { history.push({ role: "assistant", content: data.reply }); return esc(data.reply).replace(/\n/g, "<br>") + footer(); }
    } catch (e) { /* neeche fallback */ }
  }
  return "Thanks for reaching out! Hamari team aapki madad karegi." + waBtn("Assalam-o-Alaikum " + C.name + ', mujhe yeh poochna tha: "' + msg + '"') + footer();
}

/* ---------- send flow ---------- */
async function sendMessage() {
  const inp = $("user-input"), btn = $("send-btn");
  const text = inp.value.trim();
  if (!text || btn.disabled) return;
  addUser(text); inp.value = ""; btn.disabled = true; showTyping();
  await new Promise(r => setTimeout(r, 600 + Math.random() * 400));
  const reply = await getReply(text);
  removeTyping(); addBot(reply); btn.disabled = false; inp.focus();
}
function quickAsk(text) { $("user-input").value = text; sendMessage(); }
$("send-btn").onclick = sendMessage;
$("user-input").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });

  '<div class="opts"><div class="opt" onclick="openModal()">📅 Book Appointment</div><div class="opt" onclick="quickAsk(\'Show deals\')">🎁 Deals</div><div class="opt" onclick="quickAsk(\'Pricing\')">💰 Pricing</div><div class="opt" onclick="quickAsk(\'Where are you located?\')">📍 Location</div></div>');
</script>
